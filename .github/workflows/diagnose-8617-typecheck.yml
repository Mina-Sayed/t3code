name: Diagnose #8617 Typecheck

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-8617-typecheck.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout #8617 head
        uses: actions/checkout@v6
        with:
          ref: fix/claude-meter-8594
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Capture typecheck diagnostics
        id: typecheck
        shell: bash
        run: |
          set +e
          vpr typecheck > typecheck.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "=== TypeScript diagnostics ==="
          grep -E 'error TS[0-9]+|TS[0-9]{4}' typecheck.log | tail -n 200 || true
          if [ "$status" -ne 0 ] && ! grep -Eq 'error TS[0-9]+|TS[0-9]{4}' typecheck.log; then
            tail -n 200 typecheck.log
          fi
          exit 0

      - name: Upload typecheck log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: typecheck-8617
          path: typecheck.log
          retention-days: 1

      - name: Fail if typecheck failed
        if: steps.typecheck.outputs.exit_code != '0'
        run: exit 1
