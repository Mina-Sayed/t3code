name: Validate 8617

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/claude-meter-8594
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Normalize regression test formatting
        shell: bash
        run: |
          set -euo pipefail
          vp fmt apps/server/src/provider/Layers/ClaudeAdapter.usageRegression.test.ts
          git diff --check

      - name: Run focused Claude adapter tests
        run: vp test run apps/server/src/provider/Layers/ClaudeAdapter.usageRegression.test.ts apps/server/src/provider/Layers/ClaudeAdapter.test.ts

      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Mina Sayed"
          git config user.email "26074858+Mina-Sayed@users.noreply.github.com"
          git add apps/server/src/provider/Layers/ClaudeAdapter.usageRegression.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git commit -m "test(server): format Claude usage regression coverage"
          git push origin HEAD:fix/claude-meter-8594
